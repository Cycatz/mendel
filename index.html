<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mendel</title>
    <style>
      :root { --paper: #f2e9d4; --plate-ink: #2b2019; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { --paper: #dcd1b9; --plate-ink: #261c15; } }
      html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
      #view { display: block; width: 100%; height: 100%; }
      #caption { position: fixed; left: 0; right: 0; bottom: 4vh; text-align: center; pointer-events: none;
        font: italic 22px/1.2 Georgia, 'Times New Roman', serif; color: var(--plate-ink); letter-spacing: 0.04em; }
      #roots { position: fixed; top: 16px; right: 16px; padding: 6px 14px; cursor: pointer;
        font: italic 16px/1.2 Georgia, 'Times New Roman', serif; color: var(--plate-ink);
        background: transparent; border: 1px solid var(--plate-ink); border-radius: 2px; }
      #roots:hover { background: rgba(43, 32, 25, 0.08); }
      #look { position: fixed; top: 16px; left: 16px; display: grid; gap: 10px; padding: 10px 12px;
        font: italic 15px/1.2 Georgia, 'Times New Roman', serif; color: var(--plate-ink);
        background: rgba(242, 233, 212, 0.86); border: 1px solid var(--plate-ink); border-radius: 2px; }
      #look[hidden] { display: none; }
      #look fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
      #look legend { padding: 0; margin-bottom: 4px; }
      #look .presets { display: flex; gap: 6px; flex-wrap: wrap; }
      #look button { font: inherit; color: inherit; background: transparent; cursor: pointer;
        border: 1px solid rgba(43, 32, 25, 0.35); border-radius: 2px; padding: 3px 8px; display: flex; align-items: center; gap: 6px; }
      #look button:hover { background: rgba(43, 32, 25, 0.08); }
      #look button[aria-pressed="true"] { border-color: var(--plate-ink); background: rgba(43, 32, 25, 0.12); }
      #look .swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(43, 32, 25, 0.4); }
      #look input[type=range] { width: 100%; accent-color: var(--plate-ink); margin: 0; }
      #look legend { display: flex; justify-content: space-between; width: 100%; gap: 12px; }
      #look output { font-style: normal; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
      #hue { -webkit-appearance: none; appearance: none; height: 14px; border-radius: 7px; border: 1px solid rgba(43, 32, 25, 0.35);
        background: linear-gradient(to right, hsl(0 45% 70%), hsl(30 45% 70%), hsl(60 45% 70%), hsl(90 45% 70%), hsl(120 45% 70%), hsl(150 45% 70%), hsl(180 45% 70%), hsl(210 45% 70%), hsl(240 45% 70%), hsl(270 45% 70%), hsl(300 45% 70%), hsl(330 45% 70%), hsl(360 45% 70%)); }
      #hue::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--plate-ink); }
      #hue::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--plate-ink); }
      #look .ends { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.75; margin-top: -2px; }
      @media (max-width: 520px) { #look { top: auto; bottom: 12vh; left: 12px; right: 12px; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="caption"></div>
    <button id="roots" type="button" aria-pressed="false">Show roots</button>
    <form id="look" aria-label="Look" onsubmit="return false">
      <fieldset><legend><span>Flower colour</span><output id="hue-out" for="hue"></output></legend>
        <div class="presets" id="hue-presets"></div>
        <input id="hue" type="range" min="0" max="1" step="0.005" aria-label="Flower colour: drag along the colours">
      </fieldset>
      <fieldset><legend><span>Outline</span><output id="ink-out" for="ink"></output></legend>
        <div class="presets" id="ink-presets"></div>
        <input id="ink" type="range" min="0" max="1" step="0.05" aria-label="Outline strength, from none to full">
        <div class="ends" aria-hidden="true"><span>None</span><span>Full</span></div>
      </fieldset>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
